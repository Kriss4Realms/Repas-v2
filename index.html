<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Repas & Courses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mes Repas & Courses</h1>
        <p>Planning & Liste Intermarché (4 pers.)</p>
    </header>

    <nav>
        <button id="tab-planning-btn" class="active" onclick="switchTab('planning')">Planning</button>
        <button id="tab-courses-btn" onclick="switchTab('courses')">Courses</button>
        <button id="tab-database-btn" onclick="switchTab('database')">Recettes</button>
    </nav>

    <main>
        <!-- Onglet Planning -->
        <div id="tab-planning" class="tab-content active">
            <div class="card">
                <div style="margin-bottom: 12px;">
                    <label for="start-date" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">
                        Semaine du (date de départ) :
                    </label>
                    <input type="date" id="start-date" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem;" onchange="loadPlanningForWeek()">
                </div>
                <button class="btn" onclick="generateAndSaveMenu()">🎲 Générer & Enregistrer le planning</button>
            </div>

            <div id="planning-container" class="card">
                <p style="text-align: center; color: var(--text-muted);">Sélectionnez une date pour charger ou générer le planning.</p>
            </div>
        </div>

        <!-- Onglet Courses -->
        <div id="tab-courses" class="tab-content">
            <div class="card">
                <h2>
                    Liste de Courses
                    <span id="courses-count" style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;"></span>
                </h2>
                <div id="courses-container">
                    <p style="text-align: center; color: var(--text-muted);">Générez d'abord un planning pour voir la liste de courses.</p>
                </div>
            </div>
        </div>

        <!-- Onglet Base de données / Recettes -->
        <div id="tab-database" class="tab-content">
            <div class="card">
                <h2>Ajouter une recette</h2>
                <input id="new-recipe-name" type="text" placeholder="Nom du plat" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;">
                <textarea id="new-recipe-ingredients" placeholder="Un ingrédient par ligne :&#10;nom ; quantité ; unité ; rayon&#10;Lardons fumés ; 200 ; g ; Charcuterie"></textarea>
                <button class="btn" onclick="addRecipe()">Ajouter la recette</button>
            </div>

            <div class="card">
                <h2>Plats enregistrés (<span id="recipes-count">0</span>)</h2>
                <div id="recipes-list"></div>
            </div>

            <div class="card">
                <h2>Invariables / Tronc commun (<span id="invariables-count">0</span>)</h2>
                <div id="invariables-list"></div>
            </div>
        </div>
    </main>

    <!-- Supabase SDK & Notre Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
